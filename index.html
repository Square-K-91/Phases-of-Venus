<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>금성의 위상 변화 - Square_K</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh; /* Dynamic Viewport Height */
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
            touch-action: none;
            user-select: none;
            position: fixed; /* 화면 회전 시 UI 위치 고정 */
        }
        /* 우측 상단 브랜드 로고 */
        #brand {
            position: fixed;
            top: max(15px, env(safe-area-inset-top));
            right: max(20px, env(safe-area-inset-right));
            color: #888888;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            z-index: 10;
        }
        
        /* 하단 컨트롤러 UI Container */
        #ui-container {
            position: fixed;
            bottom: max(25px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
            z-index: 10;
            width: 90%;
            max-width: 400px;
        }
        button {
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #333;
            border: 2px solid #fff;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:active {
            background-color: #666;
        }
        .instruction {
            margin-bottom: 8px;
            font-size: 13px;
            text-shadow: 1px 1px 3px black;
            color: #bbb;
        }

        /* 모바일 세부 조정 */
        @media (max-width: 600px) {
            #brand {
                font-size: 11px;
            }
            button {
                padding: 10px 28px;
                font-size: 15px;
            }
            .instruction {
                font-size: 11px;
            }
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <div class="instruction">화면을 드래그하여 시점을 변경해보세요</div>
        <button id="toggleBtn">정지</button>
    </div>

    <script>
        // 1. 씬, 카메라, 렌더러 설정
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        function updateCameraDistance() {
            camera.aspect = window.innerWidth / window.innerHeight;
            // 세로 모드 및 가로 모드에 맞춘 최적 뷰포트 거리 설정
            if (window.innerWidth < window.innerHeight) {
                camera.position.set(0, 10, 52); // 세로 모드
            } else {
                camera.position.set(0, 8, 38);  // 가로 모드
            }
            camera.lookAt(0, 0, 0);
            camera.updateProjectionMatrix();
        }

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        updateCameraDistance();

        // 2. 조명
        scene.add(new THREE.AmbientLight(0xffffff, 0.05));
        
        const sunLight = new THREE.PointLight(0xffffff, 2, 100);
        sunLight.position.set(0, 0, 0);
        scene.add(sunLight);

        // 3. 천체 오브젝트 생성
        const sunGeo = new THREE.SphereGeometry(3, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffdd00 });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        scene.add(sun);

        const earthGeo = new THREE.SphereGeometry(1.5, 32, 32);
        const earthMat = new THREE.MeshStandardMaterial({ color: 0x2288ff, roughness: 0.8 });
        const earth = new THREE.Mesh(earthGeo, earthMat);
        earth.position.set(0, 0, 25);
        scene.add(earth);

        const venusGeo = new THREE.SphereGeometry(1.2, 32, 32);
        const venusMat = new THREE.MeshStandardMaterial({ color: 0xffaa55, roughness: 0.5 });
        const venus = new THREE.Mesh(venusGeo, venusMat);
        scene.add(venus);

        const orbitRadius = 13;
        const orbitGeo = new THREE.BufferGeometry();
        const orbitPoints = [];
        for (let i = 0; i <= 64; i++) {
            const angle = (i / 64) * Math.PI * 2;
            orbitPoints.push(new THREE.Vector3(Math.cos(angle) * orbitRadius, 0, Math.sin(angle) * orbitRadius));
        }
        orbitGeo.setFromPoints(orbitPoints);
        const orbitMat = new THREE.LineBasicMaterial({ color: 0x444444 });
        const orbitLine = new THREE.Line(orbitGeo, orbitMat);
        scene.add(orbitLine);

        // 4. 애니메이션 상태 및 토글 이벤트
        let isPlaying = true;
        let venusAngle = 0;
        const venusSpeed = 0.01;

        const toggleBtn = document.getElementById('toggleBtn');
        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isPlaying = !isPlaying;
            toggleBtn.textContent = isPlaying ? "정지" : "재생";
        });

        // 마우스 & 터치 조작 (회전 조절)
        let isDragging = false;
        let previousPosition = { x: 0, y: 0 };

        function getPos(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function onStart(e) {
            isDragging = true;
            previousPosition = getPos(e);
        }

        function onEnd() {
            isDragging = false;
        }

        function onMove(e) {
            if (!isDragging) return;
            
            const currentPos = getPos(e);
            const deltaX = currentPos.x - previousPosition.x;
            const deltaY = currentPos.y - previousPosition.y;

            camera.position.x -= deltaX * 0.05;
            camera.position.y += deltaY * 0.05;
            camera.lookAt(0, 0, 0);

            previousPosition = currentPos;
        }

        window.addEventListener('mousedown', onStart);
        window.addEventListener('mouseup', onEnd);
        window.addEventListener('mousemove', onMove);

        window.addEventListener('touchstart', onStart, { passive: true });
        window.addEventListener('touchend', onEnd);
        window.addEventListener('touchmove', onMove, { passive: true });

        // 5. 애니메이션 루프
        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                venusAngle += venusSpeed;
                venus.position.x = Math.cos(venusAngle) * orbitRadius;
                venus.position.z = -Math.sin(venusAngle) * orbitRadius;
            }

            renderer.render(scene, camera);
        }

        // 화면 크기 조정 및 모바일 가로/세로 회전 처리
        function handleResize() {
            updateCameraDistance();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', () => {
            setTimeout(handleResize, 150);
        });

        animate();
    </script>
</body>
</html>
